# Publishes firebase/firestore.rules to the Firebase project whenever the file changes on main.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT: a service-account JSON key with only the
# "Firebase Rules Admin" and "Service Usage Consumer" roles. Forks and pull requests never get it.
name: Deploy Firestore rules

on:
  push:
    branches: [main]
    paths:
      - firebase/firestore.rules
      - firebase.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'ibrahimovfuad/pockettools'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy rules
        run: npx -y firebase-tools@latest deploy --only firestore:rules --project login-e91f7 --non-interactive
