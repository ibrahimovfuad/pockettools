# Releases: the only way anything reaches production.
#
#   • Actions → Release → Run workflow  (deploys what changed since the last v* tag, then creates the next tag)
#   • or create a tag v… yourself (GitHub → Releases → Draft a new release), which deploys what changed since the previous tag
#
# Only folders whose shipped files changed are deployed (README, src/ and tests alone never cost a deploy), and
# Firestore rules are published only if they changed — after their emulator tests pass.
# Secrets: NETLIFY_AUTH_TOKEN, FIREBASE_SERVICE_ACCOUNT (rules), FIREBASE_AUTH_ADMIN (auth domains).
name: Release

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'What to deploy: "changed" (since the last v* tag), "all", or folders separated by spaces (e.g. apps/spend site)'
        default: changed
        required: true
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    if: github.repository == 'ibrahimovfuad/pockettools'
    outputs:
      base: ${{ steps.plan.outputs.base }}
      apps: ${{ steps.plan.outputs.apps }}
      rules: ${{ steps.plan.outputs.rules }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Work out what changed
        id: plan
        env:
          WANT: ${{ github.event.inputs.apps || 'changed' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then FROM="${GITHUB_SHA}^"; else FROM=HEAD; fi
          BASE="$(git describe --tags --abbrev=0 --match 'v*' "$FROM" 2>/dev/null || true)"
          if [ -z "$BASE" ] && [ "$WANT" = changed ]; then
            echo "::error::No earlier v* tag to compare with. Run again with apps = all, or list the folders to deploy."; exit 1
          fi
          case "$WANT" in
            changed) APPS="$(python3 .github/scripts/pt.py changed "$BASE" HEAD | tr '\n' ' ')" ;;
            all)     APPS="$(python3 -c 'import sys; sys.path.insert(0, ".github/scripts"); import pt; print(" ".join(pt.folders()))')" ;;
            *)       APPS="$WANT" ;;
          esac
          RULES=false
          if [ -n "$BASE" ] && ! git diff --quiet "$BASE" HEAD -- firebase/firestore.rules firebase.json; then RULES=true; fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"
          echo "rules=$RULES" >> "$GITHUB_OUTPUT"
          {
            echo "### Release plan"
            echo "- Compared with: \`${BASE:-—}\`"
            echo "- Deploy: ${APPS:-nothing}"
            echo "- Firestore rules: $RULES"
          } >> "$GITHUB_STEP_SUMMARY"

  rules:
    needs: plan
    if: needs.plan.outputs.rules == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Test the rules on the emulator
        run: npm run test:rules
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Publish the rules
        run: npx firebase deploy --only firestore:rules --project login-e91f7 --non-interactive

  apps:
    needs: [plan, rules]
    if: always() && needs.plan.result == 'success' && needs.rules.result != 'failure' && needs.plan.outputs.apps != ''
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Find or create the Netlify sites
        run: python3 .github/scripts/pt.py sites ${{ needs.plan.outputs.apps }} | tee deploy.txt
      - name: Deploy
        run: |
          while read -r dir site domain firebase; do
            echo "::group::Deploy $dir → $domain"
            # Functions are bundled by the CLI and need the app's own dependencies
            if [ -d "$dir/netlify/functions" ] && [ -f "$dir/package-lock.json" ]; then (cd "$dir" && npm ci --no-audit --no-fund); fi
            (cd "$dir" && npx -y netlify-cli@27.20.1 deploy --prod --no-build --site "$site" --message "${GITHUB_REF_NAME} ${GITHUB_SHA::7}")
            echo "- $dir → https://$domain" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done < deploy.txt
      - name: Collect Firebase domains
        id: domains
        run: echo "list=$(awk '$4 == 1 {print $3}' deploy.txt | tr '\n' ' ' | xargs)" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        if: steps.domains.outputs.list != ''
        with:
          credentials_json: ${{ secrets.FIREBASE_AUTH_ADMIN }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        if: steps.domains.outputs.list != ''
      - name: Add domains to Firebase Auth
        if: steps.domains.outputs.list != ''
        env:
          EXTRA_DOMAINS: ${{ steps.domains.outputs.list }}
        run: TOKEN="$(gcloud auth print-access-token)" python3 .github/scripts/add_auth_domains.py

  tag:
    # A run started from the Actions tab ends by creating the tag, so the next release compares with this one.
    needs: [plan, rules, apps]
    if: always() && github.event_name == 'workflow_dispatch' && needs.plan.result == 'success' && needs.rules.result != 'failure' && needs.apps.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Create the release tag
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then echo "HEAD is already tagged."; exit 0; fi
          T="v$(date -u +%Y.%m.%d)"; N=1; NAME="$T"
          while git rev-parse -q --verify "refs/tags/$NAME" >/dev/null; do N=$((N + 1)); NAME="$T.$N"; done
          git tag "$NAME" && git push origin "$NAME"
          echo "Tagged **$NAME**" >> "$GITHUB_STEP_SUMMARY"
