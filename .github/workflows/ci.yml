# Checks for every pull request (and every push to main). Nothing here deploys or costs Netlify credits.
# The branch ruleset on main requires the "CI ok" job, which passes only if all the others pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Cache bump, English UI, CSP, required links, shared files
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then BASE="origin/$BASE_REF"; else BASE="$BEFORE"; fi
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE="HEAD^"
          python3 .github/scripts/pt.py check "$BASE" HEAD
      - name: Syntax of plain JavaScript and Python
        run: |
          find apps site scripts tests firebase shared -type f \( -name '*.js' -o -name '*.mjs' \) \
            -not -path '*/node_modules/*' -not -name 'app.js' -not -name '*.min.js' -print0 | xargs -0 -n1 node --check
          for f in apps/timer/public/app.js apps/videocall/app.js; do [ -f "$f" ] && node --check "$f"; done
          python3 -m py_compile .github/scripts/*.py

  build:
    name: Bundle is up to date
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [bookshelf, digest, habits, mood, routes, spend]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: public/app.js matches src/
        run: |
          if ! git diff --quiet -- public/app.js; then
            echo "::error file=apps/${{ matrix.app }}/public/app.js::public/app.js is out of date. Run \"npm run build\" in apps/${{ matrix.app }}, commit the result and bump CACHE in public/sw.js."
            exit 1
          fi

  smoke:
    name: Smoke tests (iPhone, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-screenshots
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm run test:rules

  account:
    name: Account and data tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run test:account
      - name: Push helpers (need the Mood function dependencies)
        run: |
          (cd apps/mood && npm ci --omit=dev --ignore-scripts --no-audit --no-fund)
          npm run test:push

  audit:
    # Report only: lists known vulnerabilities in production dependencies. It never fails the build and is not part of "CI ok".
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: npm audit (production dependencies)
        continue-on-error: true
        run: |
          for d in . tools/deploy apps/bookshelf apps/digest apps/habits apps/mood apps/routes apps/spend; do
            echo "::group::npm audit $d"
            (cd "$d" && npm audit --omit=dev --audit-level=high) || echo "::warning::npm audit reports high-severity findings in $d"
            echo "::endgroup::"
          done

  ok:
    name: CI ok
    needs: [checks, build, smoke, rules, account]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c 'import json,sys; bad=[k for k,v in json.load(sys.stdin).items() if v["result"]!="success"]; print("Failed:", ", ".join(bad) or "none"); sys.exit(1 if bad else 0)'
