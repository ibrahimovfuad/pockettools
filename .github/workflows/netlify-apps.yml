# Creates a Netlify site for every new app folder in apps/ (except the Git-linked ones listed in
# .github/netlify-sites.json), deploys apps whose folder changed, and adds their domains to
# Firebase Auth's authorized domains. Needs the secrets NETLIFY_AUTH_TOKEN (a personal access token,
# preferably with an expiry date) and FIREBASE_AUTH_ADMIN. Forks and pull requests never get them.
name: Netlify apps

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - .github/netlify-sites.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-apps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'ibrahimovfuad/pockettools'
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find changed files
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed.txt
          else
            echo "--all" > mode.txt
          fi

      - name: Create missing sites
        run: |
          if [ -f mode.txt ]; then ARG=--all; else ARG=changed.txt; fi
          python3 .github/scripts/netlify_sites.py "$ARG" > deploy.txt
          cat deploy.txt

      - name: Deploy
        run: |
          while read -r dir site domain; do
            [ -z "$dir" ] && continue
            echo "::group::Deploy $dir → $domain"
            (cd "$dir" && npx -y netlify-cli@latest deploy --prod --no-build --site "$site" --message "${{ github.sha }}")
            echo "::endgroup::"
          done < deploy.txt

      - name: Collect domains
        id: domains
        run: echo "list=$(awk '{print $3}' deploy.txt | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        if: steps.domains.outputs.list != ' ' && steps.domains.outputs.list != ''
        with:
          credentials_json: ${{ secrets.FIREBASE_AUTH_ADMIN }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.domains.outputs.list != ' ' && steps.domains.outputs.list != ''
      - name: Add domains to Firebase Auth
        if: steps.domains.outputs.list != ' ' && steps.domains.outputs.list != ''
        env:
          EXTRA_DOMAINS: ${{ steps.domains.outputs.list }}
        run: TOKEN="$(gcloud auth print-access-token)" python3 .github/scripts/add_auth_domains.py
