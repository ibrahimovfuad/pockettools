# Netlify: Base directory = apps/mood
# public/app.js is committed pre-built (npm run build). Dependencies are installed for the functions.
[build]
  publish = "public"
  functions = "netlify/functions"
  # Netlify never builds from Git: releases are deployed by .github/workflows/release.yml
  # (Netlify CLI) when a v* tag is created. This also stops Deploy Previews, which cost credits.
  ignore = "exit 0"

[functions]
  node_bundler = "esbuild"
