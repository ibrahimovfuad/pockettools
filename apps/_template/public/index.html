<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="__TITLE__">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>__TITLE__</title>
<style>
:root{color-scheme:light;--bg:#f2f2f7;--card:#fff;--text:#000;--text2:#6c6c70;--text3:#a1a1a6;--blue:#0a63ce}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--bg:#000;--card:#1c1c1e;--text:#fff;--text2:#98989f;--text3:#636366;--blue:#0a84ff}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);min-height:100%}
body{font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px)}
h1{font-size:34px;font-weight:700;letter-spacing:.3px}
.muted{color:var(--text2);margin-top:6px}
footer{margin-top:48px;text-align:center}
.nf{display:block;margin-top:6px;font-size:12px;color:inherit;opacity:.55;text-decoration:none}
.app-ver{font-size:11px;color:var(--text3);margin-top:6px;font-variant-numeric:tabular-nums}
.app-ver::after{content:var(--app-ver,'')}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
html{touch-action:pan-x pan-y}
</style>
</head>
<body>
<main id="app"></main>
<script src="nozoom.js"></script>
<script src="app.js"></script>
</body>
</html>
