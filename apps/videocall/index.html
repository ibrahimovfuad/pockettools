<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Call">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Video Call</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;color:#fff;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
body{background:radial-gradient(circle at 50% 30%,#2c2c2e,#000 75%)}
html{background:#000}
/* iOS: in the installed app the viewport is shorter by the status bar — stretch background and video to the bottom */
@media (display-mode: standalone){
  body{min-height:calc(100% + env(safe-area-inset-top))}
  #remote,body:not(.incall) #pip{height:calc(100% + env(safe-area-inset-top))}
}
button{font:inherit;cursor:pointer}
.hide{display:none!important}

/* Remote party */
#remote{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;opacity:0;transition:opacity .5s}
body.incall #remote{opacity:1}

/* Own video: full screen before the call, a small window during it */
#pip{position:fixed;left:0;top:0;width:100%;height:100%;z-index:2;overflow:hidden;
  transition:left .45s cubic-bezier(.2,.8,.2,1),top .45s cubic-bezier(.2,.8,.2,1),width .45s cubic-bezier(.2,.8,.2,1),height .45s cubic-bezier(.2,.8,.2,1),border-radius .45s,opacity .3s}
body.incall #pip{width:min(30vw,140px);height:calc(min(30vw,140px) * 4 / 3);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.55);touch-action:none}
#pip.drag{transition:none}
#pip.camoff video{opacity:.25}
#local{width:100%;height:100%;object-fit:cover;display:block}
#local.mirror{transform:scaleX(-1)}

/* Top: title and status */
#top{position:fixed;left:0;right:0;top:0;z-index:3;text-align:center;pointer-events:none;
  padding:calc(20px + env(safe-area-inset-top)) 20px 48px;background:linear-gradient(rgba(0,0,0,.5),transparent);transition:opacity .3s}
#title{font-size:26px;font-weight:600;letter-spacing:-.4px}
#sub{margin-top:4px;font-size:15px;opacity:.85;font-variant-numeric:tabular-nums;min-height:1.2em}

/* Bottom before the call */
#pre{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:center;
  padding:40px 24px calc(32px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.6))}
body.incall #pre{display:none}
#mainBtn{display:flex;align-items:center;justify-content:center;gap:10px;min-width:230px;padding:16px 30px;border:0;border-radius:32px;
  background:#34c759;color:#fff;font-weight:600;box-shadow:0 6px 20px rgba(52,199,89,.35);transition:transform .15s}
#mainBtn:active,#altBtn:active{transform:scale(.96)}
#pre{flex-direction:column;align-items:center;gap:12px}
#altBtn{min-width:230px;padding:15px 30px;border:0;border-radius:32px;background:rgba(255,255,255,.18);color:#fff;font-weight:600;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transition:transform .15s}
#newBtn{border:0;background:none;color:rgba(255,255,255,.65);font-size:15px;padding:4px 8px}
#install{font-size:14px;color:rgba(255,255,255,.6);text-align:center;max-width:300px}
#install button{border:0;background:none;color:#34c759;font-size:15px;font-weight:600;padding:4px 8px}
#hint{margin:8px auto 0;max-width:320px;font-size:14px;opacity:.6;word-break:break-all}
#mainBtn svg{width:24px;height:24px}

/* Control bar during the call */
#controls{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));z-index:4;transform:translateX(-50%);
  display:flex;gap:14px;padding:12px 16px;border-radius:36px;background:rgba(44,44,46,.55);
  -webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);transition:opacity .3s,transform .3s}
body:not(.incall) #controls{display:none}
body.incall.idle #controls{opacity:0;transform:translate(-50%,24px);pointer-events:none}
body.incall.idle #top{opacity:0}
.cbtn{width:58px;height:58px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);color:#fff;transition:background .2s,color .2s,transform .15s}
.cbtn:active{transform:scale(.92)}
.cbtn svg{width:27px;height:27px}
.cbtn .slash{display:none}
.cbtn.off{background:#fff;color:#1c1c1e}
.cbtn.off .slash{display:inline}
.cbtn.end{background:#ff3b30}

#safe{position:fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);visibility:hidden;pointer-events:none}
.nf{display:block;margin-top:18px;font-size:12px;color:inherit;opacity:.55;text-align:center;text-decoration:none}
.nf.vc{pointer-events:auto;margin-top:6px;opacity:.45}
body.incall .nf.vc{display:none}
.nf.vc.tight{margin-top:2px}
</style>
</head>
<body>
<video id="remote" playsinline autoplay></video>
<div id="pip"><video id="local" class="mirror" playsinline autoplay muted></video></div>

<div id="top"><div id="title">Video Call</div><div id="sub"></div><div id="hint"></div><a class="nf vc" href="https://github.com/ibrahimovfuad/pockettools" target="_blank" rel="noopener">Open source on GitHub</a><a class="nf vc tight" href="https://www.netlify.com" target="_blank" rel="noopener">This site is powered by Netlify</a></div>

<div id="pre"><button id="mainBtn"></button><button id="altBtn" class="hide"></button><button id="newBtn" class="hide"></button><div id="install" class="hide"></div></div>

<div id="controls">
  <button class="cbtn" id="micBtn" aria-label="Microphone">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/><path class="slash" d="M4 4l16 16"/></svg>
  </button>
  <button class="cbtn" id="camBtn" aria-label="Camera">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="2.5" y="6.5" width="13" height="11" rx="3"/><path d="M15.5 10.5l6-3v9l-6-3z"/><path class="slash" d="M3 4l17 16"/></svg>
  </button>
  <button class="cbtn" id="flipBtn" aria-label="Switch camera">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11a7.5 7.5 0 0 1 13.4-4.2M18.5 3v4h-4"/><path d="M19.5 13a7.5 7.5 0 0 1-13.4 4.2M5.5 21v-4h4"/></svg>
  </button>
  <button class="cbtn end" id="endBtn" aria-label="End call">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.6 13.6c5.3-4.8 13.5-4.8 18.8 0 .5.5.5 1.2 0 1.7l-1.9 1.9c-.4.4-1 .5-1.5.1l-2.3-1.6c-.4-.3-.6-.7-.5-1.2l.2-1.6c-2.2-.8-4.6-.8-6.8 0l.2 1.6c.1.5-.1.9-.5 1.2l-2.3 1.6c-.5.4-1.1.3-1.5-.1l-1.9-1.9c-.5-.5-.5-1.2 0-1.7z"/></svg>
  </button>
</div>
<div id="safe"></div>

<script src="peerjs.min.js"></script>
<script src="app.js"></script>
</body>
</html>
